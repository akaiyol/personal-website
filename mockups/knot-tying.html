<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knot tying study</title>
<style>
:root{color-scheme:dark;--ink:#c5b5ec;--ground:#000}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:13px/1.6 Menlo,Consolas,monospace}.study{width:min(520px,100%);padding:24px}svg{display:block;width:100%;height:auto;overflow:visible}.cord{fill:none;stroke:var(--ink);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}.core{stroke:var(--ground);stroke-width:1.4}.under{stroke:var(--ground);stroke-width:9;stroke-linecap:butt}.tip{fill:var(--ink)}.controls{display:flex;align-items:center;justify-content:space-between;margin:8px 0 0;padding:0 12px}button{font:inherit;background:none;color:inherit;border:0;padding:10px 0;min-width:80px;min-height:44px;cursor:pointer}button:hover{text-decoration:underline;text-underline-offset:5px}button:focus-visible{outline:1px dashed var(--ink);outline-offset:5px}.phase{font-size:11px} @media(max-width:400px){.study{padding:16px}}
</style></head><body><main class="study"><svg viewBox="-220 -220 440 490" role="img" aria-labelledby="knot-title knot-desc"><title id="knot-title">A flower knot being tied</title><desc id="knot-desc">A single lavender cord draws six loose loops and crossing strands, then pulls inward into a compact flower knot with two hanging ends.</desc><path id="rope" class="cord" pathLength="1"/><path id="core" class="cord core" pathLength="1"/><g id="crossings" aria-hidden="true"></g><circle id="tip" class="tip" r="2.3" aria-hidden="true"/></svg><div class="controls"><button id="replay" type="button">[ replay ]</button><span id="phase" class="phase" aria-live="polite">drawing</span></div></main>
<script>
(()=>{'use strict';
const ns='http://www.w3.org/2000/svg',rope=document.querySelector('#rope'),core=document.querySelector('#core'),crossings=document.querySelector('#crossings'),tip=document.querySelector('#tip'),phase=document.querySelector('#phase'),replay=document.querySelector('#replay'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const duration=8000,drawDuration=4700,hold=600,tightenDuration=2700;
let elapsed=0,last=null,raf=null,finished=false;
const mix=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,polar=(a,r)=>({x:Math.cos(a)*r,y:Math.sin(a)*r});
function cubic(a,b,c,d,t){const u=1-t;return{x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y}}
function geometry(tight){const neck=mix(65,18,tight),reach=mix(226,143,tight),points=[];let current={x:mix(-70,-16,tight),y:mix(238,216,tight)};points.push({...current,section:-1});
function curve(b,c,d,section,steps=42){const a=current;for(let i=1;i<=steps;i++)points.push({...cubic(a,b,c,d,i/steps),section});current=d}
for(let lobe=0;lobe<6;lobe++){const angle=-Math.PI/2+lobe*Math.PI/3;const start=polar(angle-Math.PI/2,neck),end=polar(angle+Math.PI/2,neck);if(lobe===0)curve({x:current.x-20,y:150},{x:start.x-22,y:75},start,-1,32);else curve(current,start,start,2*lobe-1,18);
const irregular=mix(1+.10*Math.sin(lobe*2.7),1,tight);curve(polar(angle-.38,reach*irregular),polar(angle+.38,reach*irregular),end,2*lobe,64)}
curve({x:current.x+28,y:75},{x:mix(100,27,tight),y:145},{x:mix(92,20,tight),y:mix(228,216,tight)},12,40);
return points}
function intersect(a,b,c,d){const rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,den=rx*sy-ry*sx;if(Math.abs(den)<.001)return null;const qx=c.x-a.x,qy=c.y-a.y,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;return t>.001&&t<.999&&u>.001&&u<.999?{x:a.x+t*rx,y:a.y+t*ry,t,u}:null}
function path(points){return points.map((p,i)=>(i?'L':'M')+p.x.toFixed(3)+' '+p.y.toFixed(3)).join(' ')}
function render(ms){const drawing=Math.min(1,ms/drawDuration),tight=ease(Math.max(0,Math.min(1,(ms-drawDuration-hold)/tightenDuration))),points=geometry(tight);const d=path(points);rope.setAttribute('d',d);core.setAttribute('d',d);rope.style.strokeDasharray=core.style.strokeDasharray=drawing+' 1';
const lengths=[0];for(let i=1;i<points.length;i++)lengths[i]=lengths[i-1]+Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);const total=lengths.at(-1),drawn=total*drawing;let cursor=points[0];for(let i=1;i<points.length;i++)if(lengths[i]>=drawn){const f=(drawn-lengths[i-1])/(lengths[i]-lengths[i-1]||1);cursor={x:mix(points[i-1].x,points[i].x,f),y:mix(points[i-1].y,points[i].y,f)};break}
tip.setAttribute('cx',cursor.x);tip.setAttribute('cy',cursor.y);tip.style.display=drawing<1?'':'none';
// Crossing masks follow the actual moving cord geometry, not a pasted final knot.
const fragments=[];let count=0;for(let i=1;i<points.length;i++)for(let j=i+6;j<points.length;j++){if(points[i].section===points[j].section)continue;const hit=intersect(points[i-1],points[i],points[j-1],points[j]);if(!hit)continue;count++;const pair=[points[i].section,points[j].section].sort((a,b)=>a-b),over=(pair[0]+pair[1])%2===0?i:j;if(Math.max(lengths[i],lengths[j])>drawn)continue;const line=path(points.slice(Math.max(0,over-4),Math.min(points.length,over+5)));fragments.push(`<path class="cord under" d="${line}"/><path class="cord" d="${line}"/><path class="cord core" d="${line}"/>`)}
crossings.innerHTML=fragments.join('');const label=ms<drawDuration?'drawing':ms<drawDuration+hold?'loops ready':ms<duration?'tightening':'tied';if(phase.textContent!==label)phase.textContent=label;document.body.dataset.phase=label;document.body.dataset.tightness=tight.toFixed(4);document.body.dataset.crossings=count;document.body.dataset.elapsed=Math.round(ms)}
function tick(now){raf=null;if(document.hidden)return;if(last!==null)elapsed+=now-last;last=now;elapsed=Math.min(elapsed,duration);render(elapsed);if(elapsed<duration)raf=requestAnimationFrame(tick);else{finished=true;last=null}}
function start(){if(raf!==null)cancelAnimationFrame(raf);elapsed=0;last=null;finished=false;if(reduced.matches){render(duration);finished=true;return}render(0);if(!document.hidden)raf=requestAnimationFrame(tick)}
replay.addEventListener('click',start);document.addEventListener('visibilitychange',()=>{if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;if(!document.hidden&&!finished&&!reduced.matches)raf=requestAnimationFrame(tick)});reduced.addEventListener('change',start);start();
})();
</script></body></html>
