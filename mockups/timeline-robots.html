<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline robot studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#C5B5EC;font:14px/1.7 Menlo,Consolas,monospace;padding:28px}main{max-width:1000px;margin:auto;border:1px solid;padding:24px 36px}header{border-bottom:1px solid;padding-bottom:18px;margin-bottom:25px}h1{font:inherit;font-size:21px;margin:0 0 8px}p{margin:0}nav{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button{background:#000;color:#C5B5EC;border:1px solid;font:inherit;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#C5B5EC;color:#000}button:focus-visible{text-decoration:underline;outline:none}.context{max-width:650px;margin-top:35px;padding-left:24px;border-left:1px solid;position:relative}.context:before{content:"";position:absolute;left:-4px;top:8px;width:7px;height:7px;background:#C5B5EC}h2{font:inherit;font-size:17px;margin:0 0 4px}.role{margin-bottom:12px}.tools{font-size:12px;margin-top:15px}.gap{height:300px;display:flex;align-items:center;justify-content:center}pre{font:14px/1.3 Menlo,Consolas,monospace;margin:0;white-space:pre;user-select:none}.caption{font-size:12px;max-width:65ch;min-height:44px;margin-top:20px}footer{border-top:1px solid;padding-top:16px;margin-top:24px;font-size:12px}.stage{width:100%;overflow:hidden}@media(max-width:600px){body{padding:12px}main{padding:20px 16px}nav{gap:8px}button{font-size:12px;padding:8px}.context{padding-left:16px}pre{font-size:11px}.gap{height:300px}h1{font-size:18px}}@media(max-width:360px){pre{font-size:10px}}
</style>
<main><header><h1>timeline / little builders</h1><p>Three animation studies for the final experience gap.</p></header>
<nav aria-label="Animation studies"><button data-scene="0" aria-pressed="true">1 / block builder</button><button data-scene="1" aria-pressed="false">2 / terminal mechanic</button><button data-scene="2" aria-pressed="false">3 / little gardener</button></nav>
<div class="context"><h2>WSP · Buildings</h2><p class="role">Electrical Engineering Intern</p><p>Working with the Buildings team at an engineering consulting firm.</p><p class="tools">[ AutoCAD ] [ Revit ] [ BIM 360 ]</p><div class="gap"><div class="stage" role="img" aria-label="A small character-art robot building a tower of blocks"><pre aria-hidden="true" id="art"></pre></div></div></div>
<p class="caption" id="caption"></p><footer><button id="pause" aria-pressed="false">pause</button> <span id="status">8-second loop · proposed artwork only</span></footer></main>
<script>
const art=document.querySelector('#art'),caption=document.querySelector('#caption'),stage=document.querySelector('.stage');
const descriptions=['A patient builder stacks three blocks, admires the tower, then takes it apart to begin again.','A tiny mechanic assembles a terminal, types a heart, and closes it before the next build.','A small gardener waters a sprout, watches it flower, and gathers a seed for the next cycle.'];
const labels=['A small character-art robot stacking blocks','A small character-art robot assembling a computer terminal','A small character-art robot watering a growing flower'];
let scene=0,tick=0,paused=false,timer;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function draw(){
 const grid=Array.from({length:15},()=>Array(38).fill(' '));
 function ink(x,y,text){text.split('\n').forEach((line,dy)=>[...line].forEach((c,dx)=>{if(grid[y+dy]&&x+dx>=0&&x+dx<38)grid[y+dy][x+dx]=c}));}
 const step=tick%16,reach=[2,3,6,7,10,11].includes(step),blink=step===12;
 ink(6,3,'    ╷\n  ┌─┴───┐\n  │ '+(blink?'─ ─':'• •')+' │\n  └──┬──┘');
 ink(7,7,reach?'┌──┴──┐───⊏':'┌──┴──┐\n│  ▪  │');
 if(reach)ink(7,8,'│  ▪  │');
 ink(7,9,'└┬───┬┘\n ╵   ╵\n╶┴╴ ╶┴╴');
 ink(4,12,'──────────────────────────────');
 if(scene===0){const count=step<8?Math.min(3,Math.floor(step/2)):Math.max(0,3-Math.floor((step-8)/2));for(let n=0;n<count;n++)ink(24,10-n*2,'┌────┐\n└────┘');if(reach)ink(17,6,'┌────┐\n└────┘');if(step===8||step===9)ink(24,2,'  ✧');}
 if(scene===1){ink(22,11,'───┴────');if(step>=2&&step<=13)ink(21,5,'┌────────┐\n│        │\n│        │\n└────────┘\n    │');if(step>=6&&step<=11)ink(23,7,step<8?'> _':'> <3');if(reach)ink(18,6,'+');if(step===10)ink(32,4,'*');}
 if(scene===2){ink(23,10,'\\      /\n \\____/');const height=step<8?Math.floor(step/2):Math.max(0,3-Math.floor((step-8)/2));for(let n=0;n<height;n++)ink(26,9-n,'│');if(height>1)ink(24,8,'╲ │ ╱');if(height===3)ink(25,5,'\\|/\n-*-\n/|\\');if(reach){ink(17,7,'╭──╮_\n╰──╯ ');ink(23,8,step%2?' ·':'· ');}}
 art.textContent=grid.map(row=>row.join('').trimEnd()).join('\n');caption.textContent=descriptions[scene];stage.setAttribute('aria-label',labels[scene]);
}
function start(){clearInterval(timer);if(!paused&&!reduced.matches&&!document.hidden)timer=setInterval(()=>{tick++;draw()},500)}
document.querySelectorAll('[data-scene]').forEach(button=>button.addEventListener('click',()=>{scene=Number(button.dataset.scene);tick=0;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw();start()}));
document.querySelector('#pause').addEventListener('click',event=>{paused=!paused;event.currentTarget.textContent=paused?'play':'pause';event.currentTarget.setAttribute('aria-pressed',String(paused));start()});
reduced.addEventListener('change',()=>{tick=reduced.matches?8:0;draw();start()});document.addEventListener('visibilitychange',start);tick=reduced.matches?8:0;draw();start();
</script></html>
