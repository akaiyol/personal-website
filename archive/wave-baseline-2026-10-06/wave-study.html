<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ocean study | Yolanda</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #c5b5ec;
        font:
          12px Menlo,
          Consolas,
          monospace;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px;
      }
      header {
        width: min(1200px, 100%);
        margin: 0 auto 30px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 1px dashed #c5b5ec;
      }
      pre {
        font:
          9px/9px Menlo,
          Consolas,
          monospace;
        letter-spacing: 0;
        white-space: pre;
        margin: 0;
        width: 100%;
        height: 360px;
        overflow: hidden;
      }
      .study {
        width: min(1200px, 100%);
        margin: 0 auto;
        border: 1px solid #c5b5ec;
        overflow: hidden;
      }
      @media (max-width: 600px) {
        body {
          padding: 14px;
        }
        pre {
          height: 280px;
        }
        header {
          font-size: 11px;
        }
      }
      ::selection {
        background: #c5b5ec;
        color: #000;
      }
    </style>
  </head>
  <body data-ocean-study="true">
    <header>
      <span>ocean / motion study</span><a href="index.html">[ landing page ]</a>
    </header>
    <div class="study"><pre id="waves" aria-hidden="true"></pre></div>
    <script type="module" src="ocean/main.js"></script>
  </body>
</html>
